<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ai-office</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 8 8'%3E%3Crect width='8' height='8' fill='%233a281d'/%3E%3Crect x='1' y='2' width='6' height='4' fill='%23ffcf6a'/%3E%3Crect x='2' y='3' width='1' height='1' fill='%233a281d'/%3E%3Crect x='5' y='3' width='1' height='1' fill='%233a281d'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="topbar">
    <div class="logo"><span class="logo-mark" aria-hidden="true"></span><b>ai-office</b></div>
    <div class="top-right">
      <span class="chip" id="chip-activity" title="Agents currently generating"><i></i><span>0 working</span></span>
      <span class="chip" id="chip-ollama" title="Local Ollama connection"><i></i><span>Ollama…</span></span>
      <span class="chip" id="chip-db" title="SQLite storage"><i class="ok"></i><span>SQLite</span></span>
      <time id="clock" class="clock"></time>
    </div>
  </header>

  <div id="layout">
    <aside id="roster" aria-label="Departments and agents">
      <h2>Departments</h2>
      <ul id="roster-list"></ul>
      <h2>Integrations</h2>
      <ul id="integrations" class="integrations"></ul>
    </aside>

    <main id="stage">
      <canvas id="office" aria-label="Isometric pixel-art office. Click a character to open its profile."></canvas>
      <div id="labels"></div>
      <div id="offline" hidden>Ollama is offline. The office still runs, but agents cannot think until you start it (<code>ollama serve</code>).</div>
      <div id="hint">Click a character to talk to them</div>
    </main>

    <aside id="panel" aria-label="Selected agent"></aside>
  </div>

  <div id="toasts" role="status" aria-live="polite"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
